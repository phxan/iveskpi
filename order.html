<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司下午茶訂購表單</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 自訂一些簡單的動畫效果 */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-amber-50 min-h-screen font-sans text-gray-800">

    <div class="max-w-xl mx-auto pt-10 pb-20 px-4 sm:px-6 lg:px-8">
        
        <!-- 表單標題區塊 -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-amber-200 mb-4 text-amber-700 text-3xl shadow-sm">
                <i class="fa-solid fa-mug-hot"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-900 mb-2">04/17(五) 歡樂下午茶時光</h1>
            <p class="text-gray-600">請填寫您的全名與餐點搭配，慰勞一下辛苦的自己吧！<br>
            <span class="text-amber-600 font-medium text-sm">（若真的沒有想法也可以棄填，將由小助理協助搭配唷~）</span></p>
        </div>

        <!-- 熱門排行榜區塊 -->
        <div id="leaderboard" class="bg-amber-100/50 rounded-2xl p-6 mb-8 hidden fade-in border border-amber-200">
            <h3 class="text-lg font-bold text-amber-800 mb-3 flex items-center">
                <i class="fa-solid fa-fire text-red-500 mr-2"></i> 目前大家都在點什麼？
            </h3>
            <ul id="popularList" class="space-y-2 text-sm text-gray-700">
                <li><i class="fa-solid fa-spinner fa-spin mr-2"></i>資料載入中...</li>
            </ul>
        </div>

        <!-- 表單區塊 -->
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden fade-in">
            <div class="p-6 sm:p-8">
                <form id="orderForm" class="space-y-6">
                    
                    <!-- 姓名填寫 -->
                    <div>
                        <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">
                            您的全名 <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="name" name="name" required placeholder="例如：王小明"
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-amber-400 focus:border-amber-400 outline-none transition-colors">
                        <p class="text-xs text-red-500 mt-1"><i class="fa-solid fa-circle-exclamation mr-1"></i>請務必填寫正確，否則無法提供客製化餐點</p>
                    </div>

                    <!-- A區：主餐選擇 -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-3">
                            A區：主餐選項 (請擇一) <span class="text-red-500">*</span>
                        </label>
                        <div class="space-y-3">
                            <label class="flex items-start p-4 border rounded-lg cursor-pointer hover:bg-amber-50 transition-colors has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50">
                                <input type="radio" name="main_meal" value="三年愛班 豆花黑白配冰沙" required class="w-4 h-4 mt-1 text-amber-600 border-gray-300 focus:ring-amber-500">
                                <div class="ml-3">
                                    <span class="flex items-center flex-wrap gap-1.5 font-medium">
                                        <span class="px-2 py-0.5 bg-blue-100 text-blue-800 text-xs rounded shadow-sm border border-blue-200">三年愛班</span>
                                        <span>豆花黑白配冰沙</span>
                                        <i class="fa-solid fa-bowl-food text-blue-500"></i>
                                        <span class="fire-badge"></span>
                                    </span>
                                    <span class="block text-sm text-gray-500 mt-1">豆花 + 牛奶冰沙及黑糖冰沙</span>
                                </div>
                            </label>
                            <label class="flex items-start p-4 border rounded-lg cursor-pointer hover:bg-amber-50 transition-colors has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50">
                                <input type="radio" name="main_meal" value="三年愛班 雙黑白配冰沙" required class="w-4 h-4 mt-1 text-amber-600 border-gray-300 focus:ring-amber-500">
                                <div class="ml-3">
                                    <span class="flex items-center flex-wrap gap-1.5 font-medium">
                                        <span class="px-2 py-0.5 bg-blue-100 text-blue-800 text-xs rounded shadow-sm border border-blue-200">三年愛班</span>
                                        <span>雙黑白配冰沙</span>
                                        <i class="fa-solid fa-ice-cream text-pink-500"></i>
                                        <span class="fire-badge"></span>
                                    </span>
                                    <span class="block text-sm text-gray-500 mt-1">仙草凍 + 豆花 + 牛奶冰沙及黑糖冰沙</span>
                                </div>
                            </label>
                            <label class="flex items-start p-4 border rounded-lg cursor-pointer hover:bg-amber-50 transition-colors has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50">
                                <input type="radio" name="main_meal" value="三年愛班 仙草凍黑白配冰沙" required class="w-4 h-4 mt-1 text-amber-600 border-gray-300 focus:ring-amber-500">
                                <div class="ml-3">
                                    <span class="flex items-center flex-wrap gap-1.5 font-medium">
                                        <span class="px-2 py-0.5 bg-blue-100 text-blue-800 text-xs rounded shadow-sm border border-blue-200">三年愛班</span>
                                        <span>仙草凍黑白配冰沙</span>
                                        <i class="fa-solid fa-mug-hot text-emerald-600"></i>
                                        <span class="fire-badge"></span>
                                    </span>
                                    <span class="block text-sm text-gray-500 mt-1">仙草凍 + 牛奶冰沙及黑糖冰沙</span>
                                </div>
                            </label>
                            <label class="flex items-start p-4 border rounded-lg cursor-pointer hover:bg-amber-50 transition-colors has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50">
                                <input type="radio" name="main_meal" value="陳Q 香雞排" required class="w-4 h-4 mt-1 text-amber-600 border-gray-300 focus:ring-amber-500">
                                <div class="ml-3">
                                    <span class="flex items-center flex-wrap gap-1.5 font-medium">
                                        <span class="px-2 py-0.5 bg-orange-100 text-orange-800 text-xs rounded shadow-sm border border-orange-200">陳Q</span>
                                        <span>香雞排</span>
                                        <i class="fa-solid fa-drumstick-bite text-orange-500"></i>
                                        <span class="fire-badge"></span>
                                    </span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- B區：冰沙配料與點心 (動態顯示) -->
                    <div id="sideOptionsContainer" class="hidden space-y-6 bg-amber-50/50 p-4 rounded-xl border border-amber-100">
                        <!-- 配料選擇 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-3">
                                冰沙配料 (請擇一) <span class="text-red-500">*</span>
                            </label>
                            <div class="space-y-3">
                                <label class="flex items-center p-4 border bg-white rounded-lg cursor-pointer hover:bg-amber-50 transition-colors has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50">
                                    <input type="radio" name="toppings_radio" value="黑糖粉粿、芋圓、花生" class="w-4 h-4 text-amber-600 border-gray-300 focus:ring-amber-500">
                                    <div class="ml-3 font-medium flex items-center gap-2">
                                        <i class="fa-solid fa-cubes-stacked text-amber-600"></i>
                                        <span>黑糖粉粿、芋圓、花生</span>
                                    </div>
                                </label>
                                <label class="flex items-center p-4 border bg-white rounded-lg cursor-pointer hover:bg-amber-50 transition-colors has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50">
                                    <input type="radio" name="toppings_radio" value="黑糖粉粿、紅豆、花生" class="w-4 h-4 text-amber-600 border-gray-300 focus:ring-amber-500">
                                    <div class="ml-3 font-medium flex items-center gap-2">
                                        <i class="fa-solid fa-spoon text-amber-700"></i>
                                        <span>黑糖粉粿、紅豆、花生</span>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <!-- 點心選擇 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-3">
                                B區：點心選項 (請擇一) <span class="text-red-500">*</span>
                            </label>
                            <div class="space-y-3">
                                <label class="flex items-center p-4 border bg-white rounded-lg cursor-pointer hover:bg-amber-50 transition-colors has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50">
                                    <input type="radio" name="snack_radio" value="陳Q 炸甜不辣" class="w-4 h-4 text-amber-600 border-gray-300 focus:ring-amber-500">
                                    <div class="ml-3 font-medium flex items-center flex-wrap gap-1.5">
                                        <span class="px-2 py-0.5 bg-orange-100 text-orange-800 text-xs rounded shadow-sm border border-orange-200">陳Q</span>
                                        <span>炸甜不辣</span>
                                        <i class="fa-solid fa-fire text-red-500"></i>
                                    </div>
                                </label>
                                <label class="flex items-center p-4 border bg-white rounded-lg cursor-pointer hover:bg-amber-50 transition-colors has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50">
                                    <input type="radio" name="snack_radio" value="初一 紅豆餅" class="w-4 h-4 text-amber-600 border-gray-300 focus:ring-amber-500">
                                    <div class="ml-3 font-medium flex items-center flex-wrap gap-1.5">
                                        <span class="px-2 py-0.5 bg-rose-100 text-rose-800 text-xs rounded shadow-sm border border-rose-200">初一</span>
                                        <span>紅豆餅</span>
                                        <i class="fa-solid fa-cookie text-amber-700"></i>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- 提交按鈕 -->
                    <div class="pt-4">
                        <button type="submit" id="submitBtn" 
                            class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all flex justify-center items-center">
                            <span>確認送出</span>
                            <i id="loadingIcon" class="fa-solid fa-spinner fa-spin ml-2 hidden"></i>
                        </button>
                    </div>
                </form>

                <!-- 【終極必殺技】隱藏的 IFrame，用來偷偷接收 Google 的回應，避開安全阻擋 -->
                <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

                <!-- 成功訊息提示 -->
                <div id="successMsg" class="hidden mt-6 bg-green-50 border border-green-200 text-green-700 px-4 py-4 rounded-lg flex items-start">
                    <i class="fa-solid fa-circle-check text-green-500 mt-1 mr-3 text-lg"></i>
                    <div class="w-full">
                        <h4 class="font-bold mb-2">訂單已成功送出！</h4>
                        
                        <div class="bg-white/70 p-3 rounded border border-green-200 text-sm mb-3">
                            <p class="mb-1"><span class="font-semibold text-green-800">登記姓名：</span> <span id="resultName" class="text-gray-800"></span></p>
                            <p class="mb-1"><span class="font-semibold text-green-800">選擇主餐：</span> <span id="resultMain" class="text-gray-800"></span></p>
                            <p class="mb-1"><span class="font-semibold text-green-800">冰沙配料：</span> <span id="resultToppings" class="text-gray-800"></span></p>
                            <p><span class="font-semibold text-green-800">搭配點心：</span> <span id="resultSnack" class="text-gray-800"></span></p>
                        </div>
                        
                        <p class="text-sm text-gray-600 mb-3 bg-amber-50 p-2 rounded border border-amber-200">
                            <i class="fa-solid fa-circle-info text-amber-500 mr-1"></i>
                            <strong>若反悔請重填表單</strong>，系統將以結單前您的最後一次填寫紀錄為主。
                        </p>

                        <button id="resetBtn" class="text-sm text-green-600 underline font-medium hover:text-green-800">
                            點此重新填寫
                        </button>
                    </div>
                </div>
                
                <!-- 錯誤訊息提示 -->
                <div id="errorMsg" class="hidden mt-6 bg-red-50 border border-red-200 text-red-700 px-4 py-4 rounded-lg flex items-start">
                    <i class="fa-solid fa-circle-exclamation text-red-500 mt-1 mr-3 text-lg"></i>
                    <div>
                        <h4 class="font-bold">連線發生錯誤</h4>
                        <p class="text-sm mt-1 mb-2">無法將資料送到 Google Sheet。如果您是在「預覽視窗」中測試，請將檔案存到電腦後，直接用瀏覽器開啟再試一次。</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwXUCCMEsXSiTqWimlr288YLdgw48OuPRXEsFavx1BOKNxt3hrM5ApfR1uR-_ts4_KO/exec';
        
        const form = document.getElementById('orderForm');
        const submitBtn = document.getElementById('submitBtn');
        const loadingIcon = document.getElementById('loadingIcon');
        const successMsg = document.getElementById('successMsg');
        const errorMsg = document.getElementById('errorMsg');
        const resetBtn = document.getElementById('resetBtn');

        // 設定表單的傳統送出路徑與目標為隱藏的 iframe
        form.action = SCRIPT_URL;
        form.method = 'POST';
        form.target = 'hidden_iframe';

        let isSubmitting = false;

        form.addEventListener('submit', (e) => {
            
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
            loadingIcon.classList.remove('hidden');
            successMsg.classList.add('hidden');
            errorMsg.classList.add('hidden');

            const selectedMain = document.querySelector('input[name="main_meal"]:checked').value;
            let finalToppings = "無";
            let finalSnack = "無";

            if (selectedMain !== "陳Q 香雞排") {
                finalToppings = document.querySelector('input[name="toppings_radio"]:checked').value;
                finalSnack = document.querySelector('input[name="snack_radio"]:checked').value;
            }

            // 動態建立隱藏 input 傳送配料與點心 (對應 GAS 裡的 toppings 與 snack 變數)
            let hiddenToppings = document.getElementById('hiddenToppings');
            if (!hiddenToppings) {
                hiddenToppings = document.createElement('input');
                hiddenToppings.type = 'hidden';
                hiddenToppings.id = 'hiddenToppings';
                hiddenToppings.name = 'toppings';
                form.appendChild(hiddenToppings);
            }
            hiddenToppings.value = finalToppings;

            let hiddenSnack = document.getElementById('hiddenSnack');
            if (!hiddenSnack) {
                hiddenSnack = document.createElement('input');
                hiddenSnack.type = 'hidden';
                hiddenSnack.id = 'hiddenSnack';
                hiddenSnack.name = 'snack';
                form.appendChild(hiddenSnack);
            }
            hiddenSnack.value = finalSnack;

            // 暫存資料，等一下顯示在成功畫面上
            window.submittedName = document.getElementById('name').value;
            window.submittedMain = selectedMain;
            window.submittedToppings = finalToppings;
            window.submittedSnack = finalSnack;

            isSubmitting = true;
            // 表單會自動往 hidden_iframe 送出
        });

        // 監聽 iframe 的載入完成事件 (代表資料已經送到 Google)
        document.getElementById('hidden_iframe').addEventListener('load', function() {
            if (isSubmitting) {
                isSubmitting = false;
                
                document.getElementById('resultName').textContent = window.submittedName;
                document.getElementById('resultMain').textContent = window.submittedMain;
                document.getElementById('resultToppings').textContent = window.submittedToppings;
                document.getElementById('resultSnack').textContent = window.submittedSnack;

                form.reset();
                form.classList.add('hidden');
                successMsg.classList.remove('hidden');
                successMsg.classList.add('fade-in');
                
                setTimeout(fetchPopularity, 2000);

                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                loadingIcon.classList.add('hidden');
            }
        });

        resetBtn.addEventListener('click', () => {
            successMsg.classList.add('hidden');
            form.classList.remove('hidden');
            form.classList.add('fade-in');
        });

        const mainMealInputs = document.querySelectorAll('input[name="main_meal"]');
        const sideOptionsContainer = document.getElementById('sideOptionsContainer');
        const toppingInputs = document.querySelectorAll('input[name="toppings_radio"]');
        const snackInputs = document.querySelectorAll('input[name="snack_radio"]');

        mainMealInputs.forEach(input => {
            input.addEventListener('change', (e) => {
                const selectedMain = e.target.value;
                if (selectedMain === "陳Q 香雞排") {
                    sideOptionsContainer.classList.add('hidden');
                    toppingInputs.forEach(i => { i.required = false; i.checked = false; });
                    snackInputs.forEach(i => { i.required = false; i.checked = false; });
                } else {
                    sideOptionsContainer.classList.remove('hidden');
                    toppingInputs.forEach(i => i.required = true);
                    snackInputs.forEach(i => i.required = true);
                }
            });
        });

        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT5JLQGfuMJtXbYzQ2NmPxEgE3GFZ_6cvS4Y0m6TFHJbaYfVDeDX9srWpY6JHi9l4JJz285qNSbXx4q/pub?gid=0&single=true&output=csv';
        
        function parseCsvLine(text) {
            let ret = [], col = '', inQuote = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (c === '"') inQuote = !inQuote;
                else if (c === ',' && !inQuote) { ret.push(col); col = ''; }
                else col += c;
            }
            ret.push(col);
            return ret.map(s => s.replace(/^"|"$/g, '').trim());
        }

        async function fetchPopularity() {
            try {
                const noCacheUrl = csvUrl + '&_t=' + new Date().getTime();
                const response = await fetch(noCacheUrl);
                const text = await response.text();
                const lines = text.split(/\r?\n/);
                
                const combos = {};
                const mainCounts = {};
                
                for(let i = 1; i < lines.length; i++) {
                    if(!lines[i].trim()) continue;
                    const cols = parseCsvLine(lines[i]);
                    
                    if(cols.length >= 4) {
                        const main = cols[2]; 
                        const toppings = cols[3] || "無";
                        const snack = cols[4] || "無"; 
                        
                        let combo = main;
                        
                        // 為了相容您先前的舊資料 (合併在同一欄的字串) 做安全檢查
                        if (toppings !== "無" && !toppings.includes("配料:")) {
                            combo += ` + ${toppings}`;
                        } else if (toppings.includes("配料:")) {
                            combo += ` + ${toppings}`; // 舊版格式直接接上
                        }

                        if (snack !== "無") {
                            combo += ` + ${snack}`;
                        }
                        
                        combos[combo] = (combos[combo] || 0) + 1;
                        mainCounts[main] = (mainCounts[main] || 0) + 1;
                    }
                }

                const sortedCombos = Object.entries(combos).sort((a, b) => b[1] - a[1]);
                const popularList = document.getElementById('popularList');
                const leaderboard = document.getElementById('leaderboard');
                
                if(sortedCombos.length > 0) {
                    popularList.innerHTML = '';
                    sortedCombos.slice(0, 3).forEach((item, index) => {
                        const li = document.createElement('li');
                        li.className = 'flex justify-between items-center bg-white/60 px-3 py-2 rounded shadow-sm';
                        li.innerHTML = `<span><span class="font-bold text-amber-600 mr-2">Top ${index + 1}</span> ${item[0]}</span> <span class="bg-amber-200 text-amber-800 text-xs px-2 py-1 rounded-full">${item[1]} 人</span>`;
                        popularList.appendChild(li);
                    });
                    
                    leaderboard.classList.remove('hidden');

                    mainMealInputs.forEach(input => {
                        const count = mainCounts[input.value] || 0;
                        if(count > 0) {
                            const label = input.closest('label');
                            const badge = label.querySelector('.fire-badge');
                            if(badge && !badge.innerHTML.includes('🔥')) {
                                badge.innerHTML = `<span class="text-xs text-red-500 font-bold ml-2">(🔥 ${count}人選)</span>`;
                            }
                        }
                    });
                } else {
                    popularList.innerHTML = '<li class="text-gray-500">目前還沒有人填寫，搶頭香吧！</li>';
                    leaderboard.classList.remove('hidden');
                }
                
            } catch(error) {
                console.error("無法載入排行榜資料:", error);
            }
        }

        fetchPopularity();
    </script>
</body>
</html>
